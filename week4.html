<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Data Visualization</title>
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Weather Data Visualization</h1>
    <!-- Canvas for Chart -->
    <canvas id="weatherChart" width="700" height="400"></canvas>
    <script>
        // OpenWeatherMap API Key
        const apiKey = "4e8a0e8e54a4504e3d0363879d8f73b8";
        // City Name
        const city = "hyderabad";
        // Arrow Function + Async/Await
        const fetchWeatherData = async (city) => {
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?q=${city}&units=metric&appid=${apiKey}`
                );
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("Error fetching weather data:", error);
            }
        };
        // Promise Example
        const processWeatherData = (data) => {
            return new Promise((resolve) => {
                const labels = data.list
                    .slice(0, 5)
                    .map(entry => entry.dt_txt);
                const temperatures = data.list
                    .slice(0, 5)
                    .map(entry => entry.main.temp);
                resolve({
                    labels,
                    temperatures
                });
            });
        };
        // Arrow Function
        const renderChart = ({ labels, temperatures }) => {
            const ctx = document
                .getElementById("weatherChart")
                .getContext("2d");
            new Chart(ctx, {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: "Temperature (°C)",
                            data: temperatures,
                            borderColor: "blue",
                            backgroundColor: "lightblue",
                            borderWidth: 2,
                            fill: false,
                            tension: 0.3
                        }
                    ]
                }
            });
        };
        // Promise Chaining (Callback Style)
        fetchWeatherData(city)
            .then(processWeatherData)
            .then(renderChart)
            .catch(error => {
                console.error("Error:", error);
            });
    </script>
</body>
</html>
